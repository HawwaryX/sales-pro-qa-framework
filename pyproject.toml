[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-pro-qa-framework"
version = "0.1.0"
description = "QA framework for Sales Pro and Dot X Pro permission audits"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sales-pro-qa = "sales_pro_qa.cli:main"
sales-pro-apk = "sales_pro_qa.apk_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
